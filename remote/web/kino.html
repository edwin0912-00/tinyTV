<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<!-- Owner 2026-10-22 "чому хаптік пропав всюди": with zoom allowed iOS holds the click for its double-tap check and the
     hidden-switch haptic no longer fires inside the touch. Haptics win over pinch zoom; touch-action keeps taps instant. -->
<style>html{touch-action:manipulation}</style>
<!-- Owner 2026-10-24 «меню і розмір екрану ui не завжди внизу і в масштабі»: iOS zooms the page when a field under 16 px
     gets focus, and the fixed tab bar / dock stay pinned to the zoomed layout. 16 px everywhere, and the scale snaps back
     to 1 when the keyboard or a picker closes (re-applying the viewport makes iOS re-read maximum-scale=1). -->
<style>input,select,textarea{font-size:16px!important}</style>
<script>(() => { const m = document.querySelector('meta[name=viewport]'); if (!m) return; const c = m.content;
  const snap = () => { m.content = c + ', width=device-width'; requestAnimationFrame(() => { m.content = c; }); };
  addEventListener('focusout', e => { if (e.target.matches && e.target.matches('input,select,textarea')) setTimeout(snap, 60); }, true);
  addEventListener('orientationchange', () => setTimeout(snap, 300));
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (visualViewport.scale > 1.01 && !document.activeElement.matches('input,select,textarea')) snap(); });
})();</script>

<script>
if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
const $ = id => document.getElementById(id), view = $('view');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = t => { t = Math.max(0, Math.round(t || 0)); const h = Math.floor(t/3600), m = Math.floor(t/60)%60, s = t%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
const hap = (() => { const l = document.createElement('label'); l.style.cssText = 'position:fixed;left:-99px;opacity:0';
  const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch',''); l.append(i); document.body.append(l); return l; })();
const buzz = () => window.__tick();
// ---- Press feel (owner 2026-10-21: "more haptics everywhere; on/off should feel like you must press harder") ----
// Every button: squeeze on press, spring back, one haptic tick (never two for one tap).
// Owner 2026-10-22: no hold on the iPhone, every button acts on a tap (the unused [data-hold] code is gone, ux-review "дрібниці").
// Posters squeeze less than buttons (.97, ux-review 39).
(() => {
  const st = document.createElement('style');
  st.textContent = `button,.chip,.tile,.dc{transition:transform .32s cubic-bezier(.3,1.7,.45,1),filter .2s}
  button:active,.chip:active{transform:scale(.93);filter:brightness(1.18);transition-duration:.08s}
  .tile:active,.dc:active{transform:scale(.97);filter:brightness(1.12);transition-duration:.08s}`;
  document.head.appendChild(st);
  let last = 0;
  const tick = () => { const n = Date.now(); if (n - last < 70) return; last = n;
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;   // no tap yet: the browser refuses anyway
    try { navigator.vibrate ? navigator.vibrate(8) : hap.click(); } catch(e) {} };
  window.__tick = tick;
  // One haptic tick per tap, in the capture phase on window: it runs before any handler can stop the click.
  addEventListener('click', e => { if (e.target.closest('button,.chip,a,[role=button],select,input[type=range]')) tick(); }, true);
})();

// "Lawrence.Of.Arabia.1962.2160p.4K….mkv" -> "Lawrence Of Arabia 1962" (same rule as Library.pretty in the core).
// A release name for people: "Spider-Man.Brand.New.Day.2026.2160p.MA.WEB-DL….mkv" -> "Spider-Man Brand New Day 2026",
// "Lawrence Of Arabia (1962) [2160p] [4K]" -> "Lawrence Of Arabia (1962)"; the full name stays in the tooltip.
function torName(n){ n = String(n || ''); const f = fileTitle(/\.\w{2,4}$/.test(n) ? n : n + '.mkv'); return f.replace(/\s*\[.*$/, '').replace(/\((\d{4})$/, '($1)').replace(/\($/, '').trim() || n; }
function fileTitle(t){ t = String(t || ''); if (!/\.(mkv|mp4|m4v|avi|mov|ts|m2ts|webm|wmv|mpg|mpeg|flv|vob)$/i.test(t)) return t;
  let s = t.replace(/\.[^.]+$/, '').replace(/[._]/g, ' '); const y = /\b(19|20)\d{2}\b/.exec(s);
  if (y) s = s.slice(0, y.index + 4); else { const q = /\b(2160p|1080p|720p|480p|BDRip|WEB|HDRip|BluRay|x264|x265|HEVC)\b/i.exec(s); if (q) s = s.slice(0, q.index); }
  return s.trim() || t; }
// toast('text') or toast('text', {label, fn, ms}): the second form shows a button ("Повернути", "Відкрити") and stays ms (default 6 s).
function toast(t, a){ const el = $('toast'); el.textContent = ''; const s = document.createElement('span'); s.textContent = t; el.append(s);
  el.classList.toggle('act', !!a);
  if (a) { const b = document.createElement('button'); b.textContent = a.label; b.onclick = () => { el.classList.remove('show'); clearTimeout(el._t); if (a.fn) a.fn(); }; el.append(b); }
  el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), a ? (a.ms || 6000) : 1800); }
async function api(cmd, body){ const r = await fetch('/api/' + cmd, {method: body === undefined ? 'GET' : 'POST',
  headers: {'Content-Type':'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)}); return r.json(); }
const poster = (p, cls='ph') => p ? `<img src="${esc(p)}" loading="lazy" alt="">` : `<div class="${cls}"></div>`;
const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>';
const starIcon = '<svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>';
function epLabel(h){ return h.season ? `S${h.season} · E${h.episode}` : 'Фільм'; }
// History tile caption (ux-review 45): progress or "Переглянуто", never the word "Фільм".
function histSub(h){ const p = h.position || 0, d = h.duration || 0;
  if (h.season) return `S${h.season} · E${h.episode}` + (p >= 60 ? ' · ' + clock(p) : '');
  if (d && p / d >= .9) return 'Переглянуто';
  return p >= 60 ? clock(p) + (d ? ' з ' + clock(d) : '') : 'Не починали'; }
// A slider's filled part follows its value: --p is read by the track gradient (.rg).
const rg = el => { const lo = +el.min || 0, hi = +el.max || 1; el.style.setProperty('--p', Math.max(0, Math.min(100, ((+el.value - lo) / ((hi - lo) || 1)) * 100)) + '%'); };
const ERRNET = 'Немає зв’язку з сервером';
const CD = '<svg class="cd" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';   // small chevron after a button label
const MAC = !!(window.webkit && webkit.messageHandlers && webkit.messageHandlers.watch);
// ---- Icons: one set, 1.8 px line (names follow SF Symbols); no emoji and no text glyphs in the UI (ux-review 27) ----
const IC = {
  tv: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  mac: '<svg viewBox="0 0 24 24"><rect x="4.5" y="5" width="15" height="10.5" rx="1.5"/><path d="M2.5 19h19"/></svg>',
  pip: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1"/></svg>',
  screen: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="10" rx="1.5"/><rect x="14.5" y="10" width="7" height="10" rx="1.5"/></svg>',
  route: '<svg viewBox="0 0 24 24"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><path d="m12 15 5 6H7z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  chevd: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  dl: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
  ref: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
  disk: '<svg viewBox="0 0 24 24"><path d="M22 12H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11zM6 16h.01M10 16h.01"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88z"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M17 14V2M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z"/></svg>',
  bookmark: '<svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  off: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>',
  trailer: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg>'
};
// One empty / error state for the whole page (ux-review 18): a title, one line of help, an optional button (bind it through [data-es]).
const emptyState = (title, hint, act, ic) => `<div class="es">${ic || IC.off}<b>${esc(title)}</b>${hint ? `<p>${esc(hint)}</p>` : ''}${act ? `<button data-es>${esc(act)}</button>` : ''}</div>`;
// ---- Where "Дивитись" goes (ux-review 1/23): this device remembers the last target; with the TV off the default is this phone ----
const OUT = { get(){ try { return JSON.parse(localStorage.getItem('tinytv.out')); } catch(e) { return null; } },
              set(v){ try { localStorage.setItem('tinytv.out', JSON.stringify(v)); } catch(e) {} } };
const tvOff = () => !!(S && S.offline);
function outNow(){ const o = OUT.get(), off = tvOff();
  if (o && o.to === 'tv' && !off) return o;
  if (o && (o.to === 'here' || (o.to === 'pip' && MAC) || SCREENS.some(x => x.id === o.to && x.online))) return o;
  return {to: off ? 'here' : 'tv'}; }
const outLabel = o => o.to === 'tv' ? 'Hisense TV' : o.to === 'here' ? (MAC ? 'Тут, у вікні' : 'Цей iPhone') : o.to === 'pip' ? 'Тут, PiP' : ((SCREENS.find(x => x.id === o.to) || {}).name || 'Екран');
const outShort = o => o.to === 'tv' ? 'на Hisense TV' : o.to === 'here' ? (MAC ? 'тут, у вікні' : 'на iPhone') : o.to === 'pip' ? 'тут, PiP' : 'на «' + outLabel(o) + '»';
const outLine = () => outShort(outNow());
// With the TV off and no other target remembered, the film goes to this device: say so once, under the button (ux-review 3).
const outOffNote = () => { const p = OUT.get(); return tvOff() && (!p || p.to === 'tv') ? `ТВ не в мережі: фільм відкриється ${MAC ? 'у вікні' : 'на iPhone'}.` : ''; };
const outIcon = o => o.to === 'tv' ? IC.tv : o.to === 'here' ? (MAC ? IC.mac : IC.phone) : o.to === 'pip' ? IC.pip : IC.screen;
function syncOut(){ document.querySelectorAll('[data-outlabel]').forEach(el => { el.textContent = (el.dataset.pre ? el.dataset.pre + ' · ' : '') + outLine(); });
  const on = $('offNote'); if (on) { const t = outOffNote(); on.textContent = t; on.hidden = !t; }
  document.querySelectorAll('[data-outicon]').forEach(el => { el.innerHTML = outIcon(outNow()) + IC.chevd; }); }

// Routing: #/ home, #/f/<query> search, #/t/<encoded url> title. PREV = where the user came from, for the Back link (ux-review 19).
window.addEventListener('hashchange', route);
let PREV = '#/';
const backTo = () => /^#\/t\//.test(PREV) ? '#/' : (PREV || '#/');
function go(h){ buzz(); PREV = location.hash || '#/'; location.hash = h; }
function markTab(){ const h = location.hash.slice(1) || '/', t = h.startsWith('/d') ? 'd' : h === '/l' ? 'l' : h.startsWith('/m') ? 'm' : h.startsWith('/f') ? 'f' : 'home';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === t)); }
addEventListener('hashchange', markTab);
function route(){ markTab();
  const h = location.hash.slice(1) || '/';
  if (h.startsWith('/s/')) { location.replace('#/f/' + h.slice(3)); return; }   // one search for everything (ux-review 9)
  if (h.startsWith('/t/')) return title(decodeURIComponent(h.slice(3)));
  if (h === '/d' || h.startsWith('/d/')) return discover(h.split('/')[2] || 'foryou', decodeURIComponent(h.split('/')[3] || ''));
  if (h === '/l') return lists();
  if (h === '/f' || h.startsWith('/f/')) return findAll(decodeURIComponent(h.slice(3)));
  if (h === '/m' || h.startsWith('/m/')) return media(decodeURIComponent(h.slice(3)));
  home();
}

const head = (t, back, extra) => `<header>${back ? `<a href="${back}"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Назад</a>` : `<a href="/"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Пульт</a>`}<h1>${t}</h1>${extra || ''}</header>`;
const SEARCH_PH = 'Фільм, файл, торент, посилання';
const searchBox = (q='') => `<form class="search" id="sf"><svg viewBox="0 0 24 24" style="color:var(--mute)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" placeholder="${SEARCH_PH}" value="${esc(q)}" enterkeyhint="search" autocomplete="off"><button aria-label="Шукати"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>`;
function bindSearch(){ $('sf').onsubmit = e => { e.preventDefault(); const q = $('q').value.trim(); if (!q) return;
  if (/rezka/.test(q) && /^https?:/.test(q)) { api('kino/links', {}).catch(() => {}); go('/t/' + encodeURIComponent(q)); }
  else if (/^(https?:|magnet:)/i.test(q) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q)) linkTargets(q);
  else go('/f/' + encodeURIComponent(q)); }; }
// A link (pasted, recent or from the inbox): the TV, here or a screen. The TV path keeps it in the recent links.
const linkTargets = (u, title) => { const full = /^\w+:/.test(u) ? u : 'https://' + u;
  chooseTarget(/^magnet:/i.test(u) ? {magnet: u, tv: () => openLink(u)} : {page: full, tv: () => openLink(u)}, title || host(u)); };
// A pasted link goes to the TV and into the recent links on the home screen.
async function openLink(u){ buzz(); toast('Відкриваю на ТВ…');
  const r = await api('kino/open', {url: u}).catch(() => ({error: ERRNET}));
  if (r.error) return toast(r.error); if ($('q')) $('q').value = ''; if (!location.hash || location.hash === '#/') drawLinks(r); }
const host = u => { if (/^magnet:/i.test(u)) { const m = u.match(/dn=([^&]+)/); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : 'magnet'; }
  try { return new URL(/^\w+:/.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, ''); } catch(e) { return u; } };
function linkIcon(u){ const h = host(u).toLowerCase();
  if (/^magnet:/i.test(u)) return ['#7a4dd8', 'M'];
  if (/youtu/.test(h)) return ['#e33', 'YT'];
  if (/rezka/.test(h)) return ['#2f6f4f', 'HD'];
  const hue = [...h].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  return [`hsl(${hue} 45% 38%)`, (h[0] || '?').toUpperCase()]; }
function drawLinks(d){ const box = $('lks'); if (!box) return;
  const all = [...(d.pinned || []).map(x => ({...x, pin: 1})), ...(d.recent || [])];
  if (!all.length) { box.innerHTML = ''; box.hidden = true; return; } box.hidden = false;
  box.innerHTML = all.map(x => { const [c, t] = linkIcon(x.url);
    return `<button class="lk ${x.pin ? 'pin' : ''}" data-lu="${esc(x.url)}"><i style="background:${c}">${esc(t)}</i><span>${esc(x.title || host(x.url))}</span><b class="x" data-lx="${esc(x.url)}" aria-label="Видалити">${IC.x}</b></button>`; }).join('');
  let held = 0;
  box.querySelectorAll('[data-lu]').forEach(b => {
    b.onclick = async e => { const u = b.dataset.lu;
      if (e.target.closest('[data-lx]')) { e.stopPropagation(); buzz(); return drawLinks(await api('kino/links', {remove: u})); }
      if (box.classList.contains('edit')) { box.classList.remove('edit'); return; }
      if (Date.now() - held < 600) return;
      if (/rezka/.test(u)) return go('/t/' + encodeURIComponent(u)); linkTargets(u); };
    // Hold: edit mode (× delete); a second hold pins or unpins (max 3 pinned).
    let t; b.onpointerdown = () => { t = setTimeout(async () => { held = Date.now(); buzz();
      if (box.classList.contains('edit')) { const on = !b.classList.contains('pin'); drawLinks(await api('kino/links', {pin: b.dataset.lu, on})); box.classList.add('edit'); toast(on ? 'Закріплено' : 'Відкріплено'); }
      else { box.classList.add('edit'); toast('Хрестик видаляє · утримайте ще раз, щоб закріпити'); } }, 550); };
    b.onpointerup = b.onpointerleave = () => clearTimeout(t); });
}
// A tile opens the film page; a favourite saved from a Discover card (no page address, only imdb) opens that card: data-fi = its index in FAV.
const tile = (x, sub, fi) => `<button class="tile fade" ${x.url || fi == null ? `data-url="${esc(x.url)}"` : `data-fi="${fi}"`}>${poster(x.poster)}<span>${esc(x.ua || x.title)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
function bindTiles(){ view.querySelectorAll('[data-url]').forEach(b => b.onclick = () => go('/t/' + encodeURIComponent(b.dataset.url))); }

let FAV = [];
async function home(){
  view.innerHTML = head('Головна') + searchBox() + '<div class="lks" id="lks" hidden></div><div class="spin"></div>'; bindSearch();
  api('kino/links', {}).then(drawLinks).catch(() => {});
  let d = null; try { d = await api('kino/home'); } catch(e) {}
  const sp = view.querySelector('.spin'); if (!sp) return;
  if (!d || d.error) { sp.outerHTML = emptyState('Немає зв’язку з сервером', 'Перевірте, що tinyTV Core увімкнений', 'Повторити'); const re = view.querySelector('[data-es]'); if (re) re.onclick = () => home(); return; }
  const h = d.history || [];
  // "Обране" is one list in the core now (the film-page star and the Discover star feed the same one).
  FAV = d.fav || d.bookmarks || []; HOMELISTS = {fav: d.fav || [], watch: d.watch || []};
  let html = '';
  const c = h[0];
  if (c) { const pos = c.position || 0, started = pos >= 60, pct = c.duration ? Math.min(100, pos / c.duration * 100) : 0;
    const onTV = !!(S && S.cast && S.cast.title && S.kino && String(S.kino.id) === String(c.id)), verb = started ? 'Продовжити' : 'Дивитись';
    const sub = [c.season ? `S${c.season} · E${c.episode}` : '', started ? clock(pos) + (c.duration ? ' з ' + clock(c.duration) : '') : 'Не починали', c.translatorName ? esc(c.translatorName) : ''].filter(Boolean).join(' · ');
    html += `<div class="cont fade"><button class="cont-m" id="contGo">${poster(c.poster)}<div style="flex:1;min-width:0">
      <span class="k"${onTV ? '' : ` data-outlabel data-pre="${verb}"`}>${onTV ? 'Зараз на ТВ' : verb}</span><b>${esc(c.ua || c.title)}</b><small>${sub}</small>
      ${started ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}</div></button>
      <button class="cont-go" id="contWhere" aria-label="Куди дивитись" data-outicon></button></div>`; }
  html += '<section id="ibs" hidden><h2>Надіслано вам</h2><p class="lbl">Те, що додали ваші помічники</p><div id="ibl"></div></section>';
  html += `<section><h2>Історія</h2>${h.length ? `<div class="row">${h.map(x => tile(x, histSub(x))).join('')}</div>` : '<p class="empty">Тут з\'являться переглянуті фільми й серії.</p>'}</section>`;
  html += `<section><h2>Обране</h2>${FAV.length ? `<div class="row">${FAV.map((x, i) => tile(x, x.year, i)).join('')}</div>` : '<p class="empty">Натискайте «В обране» на картці фільму.</p>'}</section>`;
  html += `<section><h2>Завантаження</h2><div id="dls"><p class="empty">…</p></div></section>`;
  sp.outerHTML = html; bindTiles(); downloads(); inbox(); syncOut();
  view.querySelectorAll('[data-fi]').forEach(b => b.onclick = () => { buzz(); detail(FAV[+b.dataset.fi]); });
  if (c) { const open = () => go('/t/' + encodeURIComponent(c.url) + '?resume');
    $('contGo').onclick = open;
    // The chevron picks where it plays (remembered), then the film page starts it there from the saved second.
    $('contWhere').onclick = async () => { const to = await pickRoute(c.ua || c.title); if (to && to !== '__dev') open(); }; }
}

// Films agents sent ("відправ на ТВ", "запиши подивитись"): "Дивитись" asks where, "Переглянуто" marks it watched.
async function inbox(d){ d = d || await api('kino/inbox', {}).catch(() => null); const box = $('ibl'); if (!box || !d) return;
  const l = (d.items || []).filter(x => !x.seen || Date.now() / 1000 - x.seen < 86400 * 3).slice(0, 8);

  $('chB').querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { buzz(); done(L[+b.dataset.ci].v); });
  $('chB').querySelectorAll('[data-cv]').forEach(b => b.onclick = () => { buzz(); done(b.dataset.cv); });
  $('chX').onclick = () => done(null); $('choice').onclick = e => { if (e.target === $('choice')) done(null); }; }); }
// One text field in the same sheet (instead of the system prompt): resolves with the text, or null. o.ro = read-only and copied on the button.
function askText(title, value, o){ o = o || {}; return new Promise(res => { $('chT').textContent = title; $('chS').textContent = o.sub || '';
  $('chB').innerHTML = `<input id="chI" value="${esc(value || '')}" autocomplete="off" enterkeyhint="done"${o.ro ? ' readonly' : ''}><button class="pri" id="chOk">${esc(o.ok || 'Зберегти')}</button>`;
  $('choice').classList.add('show'); setTimeout(() => { const i = $('chI'); if (i) { i.focus(); i.select(); } }, 80);
  const done = v => { $('choice').classList.remove('show'); res(v); };
  $('chOk').onclick = () => { buzz(); if (o.ro) { try { $('chI').select(); document.execCommand('copy'); } catch (e) {} return done(true); } done($('chI').value.trim()); };
  $('chI').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('chOk').click(); } };
  $('chX').onclick = () => done(null); $('choice').onclick = e => { if (e.target === $('choice')) done(null); }; }); }
// A question with one red button (instead of the system confirm): resolves true or false.
function confirmSheet(title, ok, sub){ return new Promise(res => { $('chT').textContent = title; $('chS').textContent = sub || '';
  $('chB').innerHTML = `<button class="pri danger" id="chOk">${esc(ok || 'Видалити')}</button>`;
  $('choice').classList.add('show');
  const done = v => { $('choice').classList.remove('show'); res(v); };
  $('chOk').onclick = () => { buzz(); done(true); };
  $('chX').onclick = () => done(false); $('choice').onclick = e => { if (e.target === $('choice')) done(false); }; }); }
// Availability check runs in the core; re-read this tab while it works (new films appear as they are confirmed).
let POLL = null;
function pollAvail(tab, param, refresh){
  clearInterval(POLL); let last = -1;
  POLL = setInterval(async () => {
    if (!location.hash.startsWith('#/d')) return clearInterval(POLL);
    const st = await api('kino/refresh/state', {}).catch(() => null); if (!st) return;
    if ($('dprog')) $('dprog').textContent = st.building ? 'Оновлюю списки IMDb, Wikidata, фестивалів…' : st.queue ? `Перевіряю, де подивитись: черга ${st.queue}` : 'Готово';
    if (st.building) return;
    if (st.checked !== last) { last = st.checked; delete DCACHE[tab + '|' + param];
      const d = await api('kino/discover', {tab, param}).catch(() => null);
      if (d && !d.error && $('dbox')) { DCACHE[tab + '|' + param] = d; drawGrid($('dbox'), d.items || []); } }
    if (!st.queue && !st.working) clearInterval(POLL);
  }, 4000);
}

// ---------- Taste questionnaire (7 steps) ----------
let TQ = {step: 0, seed: null, t: null};
const ERAS = ['1950s', '1960s', '1970s', '1980s', '1990s', '2000s', '2010s', '2020s'];
const REG = [['hollywood', 'Англомовне'], ['europe', 'Європа'], ['asia', 'Азія'], ['ukraine', 'Україна'], ['nordic', 'Скандинавія'], ['latam', 'Латинська Америка']];
const MOODS = [['light', 'Легке'], ['serious', 'Серйозне'], ['dark', 'Темне, напружене'], ['mind', 'Розриває мозок']];
const LANGS = [['ua', 'Українська озвучка'], ['en', 'Оригінал EN'], ['ru', 'Російська озвучка']];
async function openTaste(){
  buzz(); $('tq').classList.add('show'); $('tqB').innerHTML = '<div class="spin"></div>';
  const [seed, cur] = await Promise.all([TQ.seed || api('kino/seed', {}).catch(() => null), api('kino/taste', {}).catch(() => ({}))]);
  TQ.seed = seed || {films: [], directors: [], genres: []};
  const t = (cur && cur.taste) || {};
  TQ.t = {genres: t.genres || {}, eras: t.eras || [], regions: t.regions || [], directors: t.directors || [], films: t.films || {}, langs: t.langs || ['ua'], mood: t.mood || [], maxlen: t.maxlen || 0};
  TQ.step = 0; drawTaste();
}
function drawTaste(){
  const t = TQ.t, sd = TQ.seed, N = 7;
  $('tqS').innerHTML = Array.from({length: N}, (_, i) => `<i class="${i <= TQ.step ? 'on' : ''}"></i>`).join('');
  const multi = (list, arr) => `<div class="chips">${list.map(([k, n]) => `<button class="chip ${arr.includes(k) ? 'on' : ''}" data-m="${esc(k)}">${esc(n)}</button>`).join('')}</div>`;
  const steps = [
    ['Жанри', 'Натискайте на жанр: люблю (зелений), не моє (червоний), ще раз - нейтрально.',`<div class="chips">${(sd.genres || []).map(([g, n]) => `<button class="chip ${t.genres[g] > 0 ? 'like' : t.genres[g] < 0 ? 'dis' : ''}" data-g="${g}">${esc(n)}</button>`).join('')}</div>`],
    ['Епохи', 'Кіно яких десятиліть вам ближче.', multi(ERAS.map(e => [e, e.replace('s', '-ті')]), t.eras)],
    ['Звідки кіно', 'Можна кілька.', multi(REG, t.regions)],
    ['Режисери', 'Чиї фільми ви любите.', multi((sd.directors || []).map(d => [d, d]), t.directors)],
    ['Відомі фільми', 'Оцініть ті, що бачили. Не бачили - пропускайте.', `<div class="tqf">${(sd.films || []).map(f => `<div>${f.poster ? `<img src="${esc(f.poster)}" alt="">` : ''}<span>${esc(f.title)}</span>
      <div class="b"><button data-f="${f.imdb}" data-v="1" aria-label="Подобається" class="${t.films[f.imdb] > 0 ? 'on' : ''}">${IC.up}</button><button data-f="${f.imdb}" data-v="-1" aria-label="Не подобається" class="${t.films[f.imdb] < 0 ? 'on' : ''}">${IC.down}</button></div></div>`).join('')}</div>`],
    ['Мова', 'Яку озвучку шукати першою.', multi(LANGS, t.langs)],
    ['Настрій і тривалість', 'Що зазвичай хочеться ввечері.', multi(MOODS, t.mood) + `<p style="margin-top:14px">Тривалість</p>` + `<div class="chips">${[[0, 'Будь-яка'], [120, 'До 2 год'], [150, 'До 2,5 год']].map(([v, n]) => `<button class="chip ${t.maxlen === v ? 'on' : ''}" data-l="${v}">${n}</button>`).join('')}</div>`]];
  const [h, sub, body] = steps[TQ.step];
  $('tqB').innerHTML = `<h3>${h}</h3><p>${sub}</p>${body}`;
  $('tqPrev').style.visibility = TQ.step ? 'visible' : 'hidden'; $('tqNext').textContent = TQ.step === N - 1 ? 'Зберегти' : 'Далі';
  const key = ['', 'eras', 'regions', 'directors', '', 'langs', 'mood'][TQ.step];
  $('tqB').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { buzz(); const g = b.dataset.g, v = t.genres[g] || 0; t.genres[g] = v === 0 ? 1 : v > 0 ? -1 : 0; if (!t.genres[g]) delete t.genres[g]; drawTaste(); });
  $('tqB').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { buzz(); const a = t[key], k = b.dataset.m; const i = a.indexOf(k); i < 0 ? a.push(k) : a.splice(i, 1); b.classList.toggle('on'); });
  $('tqB').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { buzz(); const f = b.dataset.f, v = +b.dataset.v; t.films[f] = t.films[f] === v ? 0 : v; if (!t.films[f]) delete t.films[f]; drawTaste(); });
  $('tqB').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { buzz(); t.maxlen = +b.dataset.l; drawTaste(); });
}
$('tqPrev').onclick = () => { buzz(); TQ.step = Math.max(0, TQ.step - 1); drawTaste(); };
$('tqNext').onclick = async () => { buzz();
  if (TQ.step < 6) { TQ.step++; drawTaste(); $('tq').scrollTop = 0; return; }
  await api('kino/taste', {taste: TQ.t}).catch(() => {}); $('tq').classList.remove('show'); DCACHE = {}; toast('Смак збережено. Підбираю фільми…');
  if (location.hash === '#/d/foryou' || location.hash === '#/d') route(); else go('/d/foryou'); };
$('tqX').onclick = () => { buzz(); $('tq').classList.remove('show'); };

api('kino/home').then(h => { HOMELISTS = {fav: (h && h.fav) || [], watch: (h && h.watch) || []}; }).catch(() => {});
loadScreens().then(syncOut).catch(() => {});   // the paired screens decide which target a remembered choice may still use

route();
</script>
<script>
// A new core build reloads this page by itself (home-screen app and the Mac panel keep it open for hours).
(() => { let mine = null;
  const check = async () => { try { const v = (await (await fetch('/api/version', {cache: 'no-store'})).json()).v;
    if (mine === null) mine = v; else if (v !== mine && !document.querySelector('#phone.show, #tor.show')) location.reload(); } catch (e) {} };
  check(); setInterval(check, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); }); })();
</script>
<script src="/np.js"></script>
<script>
// iOS: no auto-zoom on focus (maximum-scale), and when the keyboard closes put the page back where it was,
// otherwise a standalone app keeps the shift (top cut off, empty strip at the bottom).
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) window.scrollTo(0, 0); }, 120));
</script>
