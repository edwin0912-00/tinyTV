.ph-bar{display:flex;align-items:center;gap:10px;padding:10px 14px}.ph-bar b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone video{flex:1;width:100%;min-height:0;background:#000}
.ph-ctl{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px)}
.ph-ctl button{width:48px;height:48px;border-radius:50%;background:var(--card);color:var(--text);display:grid;place-items:center;font-size:14px}
.ph-ctl .pp{width:58px;height:58px;background:var(--accent);color:#fff}.ph-ctl .pp svg{fill:#fff;stroke:none;width:24px;height:24px}
.ph-ctl .wide{width:auto;border-radius:999px;padding:0 16px;display:flex;gap:8px}.ph-ctl svg{width:18px;height:18px}
.alt{height:48px;border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px}
/* Watched and started episodes (owner: другий колір і пам'ять де зупинились). */
.ep.seen{background:rgba(61,220,132,.16);color:#9be8bf}.ep.seen:after{content:"✓";position:absolute;top:3px;right:6px;font-size:10px;color:var(--green)}
.ep.part{background:rgba(255,201,77,.10)}
.ep i{position:absolute;left:6px;right:6px;bottom:5px;height:3px;border-radius:3px;background:#ffc94d;max-width:calc(100% - 12px)}
.ep.part:before{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:3px;border-radius:3px;background:rgba(255,255,255,.12)}
.ep.cur{box-shadow:inset 0 0 0 1.5px rgba(150,170,255,.9)}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin:10px 0 0}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:6px}.lg.seen{background:rgba(61,220,132,.5)}.lg.part{background:#ffc94d}
/* Inside the Mac panel (?embed): the panel has its own "‹ Пульт · Кіно" bar. */
.embed body{padding-top:8px}
.embed header:has(a[href="/"]){display:none}
.embed,.embed body{background:transparent}.embed .glow{display:none}
.embed .dock{background:rgba(26,28,36,.72)}
</style>
</head>
<body>
<div class="glow"></div>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <a href="#/" data-t="home"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Кіно</a>
  <a href="#/d" data-t="d"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Відкрити</a>
  <a href="#/l" data-t="l"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>Списки</a>
  <a href="#/m" data-t="m"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Медіа</a>
</nav>
<div class="tor" id="dx"><div class="ph-bar"><b id="dxT"></b><button class="ic" id="dxX" aria-label="Закрити">✕</button></div><div id="dxB"></div></div>
<div class="tor" id="tq"><div class="ph-bar"><b id="tqT">Ваш смак</b><button class="ic" id="tqX" aria-label="Закрити">✕</button></div>
  <div class="tq-steps" id="tqS"></div><div id="tqB"></div>
  <div class="tq-nav"><button id="tqPrev">Назад</button><button class="pri" id="tqNext">Далі</button></div></div>
<div class="choice" id="choice"><div class="choice-c"><b id="chT"></b><div id="chB"></div><button class="ch-x" id="chX">Скасувати</button></div></div>
<div class="dock" id="dock">
  <div class="dk-top"><img id="dPoster" alt=""><div class="dk-t"><b id="dTitle"></b><small id="dSub"></small></div>
    <select id="dQ" aria-label="Якість"></select>
    <select id="dA" aria-label="Звукова доріжка"></select>
    <button class="ic" id="dStop" aria-label="Зупинити на ТВ"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="pp mini-pp" id="dPP2" aria-label="Пауза або відтворення"></button>
    <button class="ic wbtn" id="dWatch" aria-label="Керування з годинника"><svg viewBox="0 0 24 24"><rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3"/><path class="wx" d="M4 4l16 16"/></svg></button>
    <button class="ic" id="dExp" aria-label="Розгорнути плеєр"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button></div>
  <div class="dk-bar"><i id="dBar"></i></div>
  <div class="dk-ctl"><button class="ic" id="dBack" aria-label="Назад 10 с">−10</button>
    <button class="pp" id="dPP" aria-label="Пауза або відтворення"></button>
    <button class="ic" id="dFwd" aria-label="Вперед 30 с">+30</button>
    <div class="dk-scrub"><input type="range" id="dSeek" min="0" max="1" step="1" aria-label="Позиція"><div class="dk-times"><span id="dPos">0:00</span><span id="dDur"></span></div></div></div>
  <div class="dk-tor" id="dTor"></div>
  <div class="dk-torb" id="dTorB"><button class="dl-b" id="dPhone">📱 На телефоні</button><button class="dl-b" id="dBg">На фоні</button><button class="dl-b del" id="dRm">Стоп і видалити</button></div>
  <div class="dk-vol"><button class="ic" id="dPrevEp" aria-label="Попередня серія"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg></button>
    <input type="range" id="dVol" min="0" max="100" step="1" aria-label="Гучність"><span id="dVolV"></span>
    <span class="vpair"><button class="ic vstep" id="dVolDn" aria-label="Тихіше">−</button><button class="ic vstep" id="dVolUp" aria-label="Гучніше">+</button></span>
    <button class="ic" id="dNextEp" aria-label="Наступна серія"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></svg></button></div>
  <button class="next" id="dNext" style="display:none"></button>
</div>
<div class="tor" id="tor"><div class="ph-bar"><b>Торенти</b><button class="ic" id="torX" aria-label="Закрити">✕</button></div><div class="chips" id="torQ"></div><div class="chips" id="torS"></div><div id="torL"></div></div>
<div class="phone" id="phone"><div class="ph-bar"><b id="phT"></b><button class="ic" id="phX" aria-label="Закрити">✕</button></div><video id="phV" controls playsinline x-webkit-airplay="allow"></video><div class="ph-ctl"><button class="ic" id="phB" aria-label="Назад 10 с">−10</button><button class="pp" id="phP" aria-label="Пауза або відтворення"></button><button class="ic" id="phF" aria-label="Вперед 30 с">+30</button><button class="ic wide" id="phFS" aria-label="На весь екран"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>На весь екран</button></div></div>
<div class="toast" id="toast"></div>
<script>
if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
const $ = id => document.getElementById(id), view = $('view');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = t => { t = Math.max(0, Math.round(t || 0)); const h = Math.floor(t/3600), m = Math.floor(t/60)%60, s = t%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0'); };
const hap = (() => { const l = document.createElement('label'); l.style.cssText = 'position:fixed;left:-99px;opacity:0';
  const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch',''); l.append(i); document.body.append(l); return l; })();
const buzz = () => { try { navigator.vibrate ? navigator.vibrate(8) : hap.click(); } catch(e) {} };
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800); }
async function api(cmd, body){ const r = await fetch('/api/' + cmd, {method: body === undefined ? 'GET' : 'POST',
  headers: {'Content-Type':'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)}); return r.json(); }
const poster = (p, cls='ph') => p ? `<img src="${esc(p)}" loading="lazy" alt="">` : `<div class="${cls}"></div>`;
const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>';
const starIcon = '<svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>';
function epLabel(h){ return h.season ? `S${h.season} · E${h.episode}` : 'Фільм'; }

// Routing: #/ home, #/s/<query> search, #/t/<encoded url> title.
window.addEventListener('hashchange', route);
function go(h){ buzz(); location.hash = h; }
function markTab(){ const h = location.hash.slice(1) || '/', t = h.startsWith('/d') ? 'd' : h === '/l' ? 'l' : h === '/m' ? 'm' : 'home';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === t)); }
addEventListener('hashchange', markTab);
function route(){ markTab();
  const h = location.hash.slice(1) || '/';
  if (h.startsWith('/s/')) return search(decodeURIComponent(h.slice(3)));
  if (h.startsWith('/t/')) return title(decodeURIComponent(h.slice(3)));
  if (h === '/d' || h.startsWith('/d/')) return discover(h.split('/')[2] || 'foryou', decodeURIComponent(h.split('/')[3] || ''));
  if (h === '/l') return lists();
  if (h === '/m') return media();
  home();
}

const head = (t, back) => `<header>${back ? `<a href="${back}"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Назад</a>` : `<a href="/"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Пульт</a>`}<h1>${t}</h1></header>`;
const searchBox = (q='') => `<form class="search" id="sf"><svg viewBox="0 0 24 24" style="color:var(--mute)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" placeholder="Пошук на HDRezka або вставте посилання" value="${esc(q)}" enterkeyhint="search" autocomplete="off"><button aria-label="Шукати"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>`;
function bindSearch(){ $('sf').onsubmit = e => { e.preventDefault(); const q = $('q').value.trim(); if (!q) return;
  if (/rezka/.test(q) && /^https?:/.test(q)) go('/t/' + encodeURIComponent(q)); else go('/s/' + encodeURIComponent(q)); }; }
const tile = (x, sub) => `<button class="tile fade" data-url="${esc(x.url)}">${poster(x.poster)}<span>${esc(x.title)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
function bindTiles(){ view.querySelectorAll('[data-url]').forEach(b => b.onclick = () => go('/t/' + encodeURIComponent(b.dataset.url))); }

async function home(){
  view.innerHTML = head('Кіно') + searchBox() + '<div class="spin"></div>'; bindSearch();
  let d; try { d = await api('kino/home'); } catch(e) { view.querySelector('.spin').outerHTML = '<p class="empty">Ядро недоступне.</p>'; return; }
  const h = d.history || [], b = d.bookmarks || [];
  let html = '';
  const c = h[0];
  if (c) { const pct = c.duration ? Math.min(100, (c.position || 0) / c.duration * 100) : 0;
    html += `<button class="cont fade" data-url="${esc(c.url)}">${poster(c.poster)}<div style="flex:1;min-width:0"><b>${S && S.cast && S.cast.title && S.kino && String(S.kino.id) === String(c.id) ? 'Зараз на ТВ' : 'Продовжити'}: ${esc(c.title)}</b>
      <small>${epLabel(c)} · ${clock(c.position)}${c.duration ? ' з ' + clock(c.duration) : ''}${c.translatorName ? ' · ' + esc(c.translatorName) : ''}</small>
      <div class="bar"><i style="width:${pct}%"></i></div></div>${playIcon}</button>`; }
  html += `<section><h2>Історія</h2>${h.length ? `<div class="row">${h.map(x => tile(x, epLabel(x))).join('')}</div>` : '<p class="empty">Тут з\'являться переглянуті фільми й серії.</p>'}</section>`;
  html += `<section><h2>${starIcon}Закладки</h2>${b.length ? `<div class="row">${b.map(x => tile(x, x.year)).join('')}</div>` : '<p class="empty">Додавайте зірочкою на картці фільму.</p>'}</section>`;
  html += `<section><h2>Завантаження</h2><div id="dls"><p class="empty">…</p></div></section>`;
  view.querySelector('.spin').outerHTML = html; bindTiles(); downloads();
  const cont = view.querySelector('.cont'); if (cont) cont.onclick = () => go('/t/' + encodeURIComponent(c.url) + '?resume');
}

// Torrents on the core host (~/Downloads/Torrent), like qBittorrent: progress, speed, keep in background or delete with files.
async function downloads(){
  const box = $('dls'); if (!box) return;
  const d = await api('kino/downloads').catch(() => null);
  if (!$('dls')) return;
  if (!d || d.error) { box.innerHTML = `<p class="empty">${esc((d && d.error) || 'Ядро недоступне')}</p>`; return; }
  const gb = v => (v / 1073741824).toFixed(1).replace('.', ',') + ' ГБ', mb = v => (v / 1048576).toFixed(1).replace('.', ',');
  const t = d.torrents || [];
  box.innerHTML = (t.length ? t.map(x => `<div class="dl ${x.active ? 'on' : ''}"><div class="dl-t"><b>${esc(x.name)}</b>
      <small>${x.done ? 'готово' : Math.floor((x.progress || 0) * 100) + '%'} з ${gb(x.size || 0)}${x.done ? '' : ' · ↓ ' + mb(x.down || 0) + ' МБ/с' + (x.eta > 0 ? ' · ще ' + (x.eta >= 3600 ? Math.floor(x.eta / 3600) + ' год ' : '') + Math.round(x.eta % 3600 / 60) + ' хв' : '')} · ${x.peers || 0} пір.</small>
      <div class="bar"><i style="width:${Math.max(1, (x.progress || 0) * 100)}%"></i></div></div>
    <button class="dl-b on" data-pl="${esc(x.magnet || '')}">${x.active ? 'на ТВ' : x.pos > 60 ? '▶ з ' + clock(x.pos) : '▶ Дивитись'}</button>
    <button class="dl-b del" data-rm="${x.hash}">Видалити</button></div>`).join('')
    : '<p class="empty">Нічого не качається.</p>') + `<p class="empty">${esc(d.folder || '')} · вільно ${gb(d.free || 0)}</p>`;
  box.querySelectorAll('[data-pl]').forEach(b => b.onclick = async () => { buzz(); if (!b.dataset.pl) return;
    const r = await api('kino/download/play', {magnet: b.dataset.pl}).catch(() => ({error: 'Ядро недоступне'})); toast(r.error || 'Запускаю на ТВ…'); });
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { buzz();
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Точно?'; return; }
    await api('kino/download/remove', {hash: b.dataset.rm}); toast('Видалено разом з файлами'); downloads(); });
}
setInterval(() => { if (document.visibilityState === 'visible' && $('dls') && !document.querySelector('#dls [data-sure="1"]')) downloads(); }, 3000);

async function search(q){
  view.innerHTML = head('Пошук', '#/') + searchBox(q) + `<button class="ghost" id="qTor" style="margin:0 0 12px">Шукати «${esc(q)}» в торентах</button>` + '<div class="spin"></div>'; bindSearch();
  $('qTor').onclick = async () => { buzz(); T = {title: q, original: q, series: false}; sel = {}; openTor(); };
  // IMDb / Wikidata names (works when HDRezka is down); each card shows its sources; HDRezka adds its own hits if it answers.
  const d = await api('kino/search2', {q}).catch(() => ({items: []}));
  const box = view.querySelector('.spin'); if (!box) return;
  box.outerHTML = '<div id="dbox"></div>';
  if ((d.items || []).length) drawGrid($('dbox'), d.items); else $('dbox').innerHTML = '<p class="empty">Нічого не знайдено.</p>';
  const rz = await api('kino/search', {q}).catch(() => []);
  if (Array.isArray(rz) && rz.length && $('dbox')) {
    $('dbox').insertAdjacentHTML('afterend', `<section><h2>Ще на HDRezka</h2><div class="grid">${rz.map(x => tile(x, x.info)).join('')}</div></section>`); bindTiles(); }
}

let T = null, sel = {};
async function title(raw){
  const resume = raw.endsWith('?resume'); const url = raw.replace(/\?resume$/, '');
  view.innerHTML = head('', '#/') + '<div class="spin"></div>';
  T = await api('kino/title', {url}).catch(() => null);
  if (!T || T.error || !T.id) {
    // HDRezka refuses: the same film as a card with torrents (owner was blocked on every action).
    const h = await api('kino/home').catch(() => ({})), all = [...(h.history || []), ...(h.bookmarks || [])];
    const e = all.find(x => x.url === url) || {};
    const t0 = e.title || decodeURIComponent((url.match(/\/\d+-([^/]+?)(-\d{4})?(-latest)?\.html/) || [])[1] || '').replace(/-/g, ' ');
    view.innerHTML = head('', '#/') + `<p class="empty">HDRezka зараз не відповідає, тому показую торенти цього фільму.</p>`;
    T = null; RZDOWN = true;
    detail({title: t0, ru: t0, orig: '', year: e.year || 0, poster: e.poster || '', imdb: e.id || url, rz: '', badges: [], dirs: [], av: null});
    return;
  }
  RZDOWN = false;
  const p = T.progress && T.progress.id ? T.progress : null;
  // Not watched before: a Ukrainian voiceover when the site has one (owner: UA first).
  const uaTr = (T.translators || []).find(t => isUAname(t.name));
  sel = { translator: (p && p.translator) || (!T.series && uaTr && uaTr.id) || T.translator, season: (p && p.season) || T.linkSeason || (T.seasons[0] || {}).n,
          episode: (p && p.episode) || T.linkEpisode || ((T.seasons[0] || {}).episodes || [])[0], quality: p && p.quality };
  if (T.linkSeason) { sel.season = T.linkSeason; sel.episode = T.linkEpisode; }
  draw(p);
  // Already on the TV (owner): the card only opens the page (voiceover, quality), it must not restart the film.
  const st = await fetch('/api/state', {cache: 'no-store'}).then(r => r.json()).catch(() => S) || {};
  const onTV = st.cast && st.cast.title && st.kino && String(st.kino.id) === String(T.id);
  if (resume && p && !onTV) start(p.position || 0);
}

function draw(p){
  const seasons = T.seasons || [], cur = seasons.find(s => s.n === sel.season) || seasons[0];
  const watched = new Set((p && p.watched) || []);
  // Per-episode memory from the core: [position, duration] by "season:episode".
  const epsMem = (p && p.eps) || {};
  const memOf = (s, e) => { const m = epsMem[s + ':' + e]; return m && m[1] > 0 ? {pos: m[0], dur: m[1], f: m[0] / m[1]} : null; };
  const isSeen = (s, e) => watched.has(s + ':' + e) || ((memOf(s, e) || {}).f >= 0.9);
  const selMem = T.series ? memOf(sel.season, sel.episode) : (p && p.duration ? {pos: p.position, dur: p.duration, f: p.position / p.duration} : null);
  const resumeAt = selMem && selMem.pos > 30 && !isSeen(sel.season, sel.episode) ? selMem.pos : 0;
  // This very episode plays on the TV with another voiceover: the button switches it there from the same second.
  const k = (S && S.kino) || {}, c = (S && S.cast) || {};
  const switchAt = c.title && String(k.id) === String(T.id) && (!T.series || (k.season === sel.season && k.episode === sel.episode))
    && String(k.translator) !== String(sel.translator) ? Math.max(1, c.position || 0) : 0;
  const playingHere = !switchAt && c.title && String(k.id) === String(T.id) && (!T.series || (k.season === sel.season && k.episode === sel.episode));
  view.innerHTML = head('', '#/') + `
  <div class="hero fade">${T.poster ? `<img src="${esc(T.poster)}" alt="">` : ''}<div style="min-width:0">
    <h3>${esc(T.title)}</h3><p>${esc([T.original, T.year, T.series ? 'серіал' : 'фільм'].filter(Boolean).join(' · '))}</p>
    <div class="hero-b"><button class="ghost ${T.bookmarked ? 'on' : ''}" id="star">${starIcon}${T.bookmarked ? 'У закладках' : 'Закладка'}</button></div></div></div>
  ${T.translators.length > 1 ? `<section><p class="lbl">Озвучка</p><div class="chips">${[...T.translators].sort((a, b) => isUAname(b.name) - isUAname(a.name)).map(t =>
     `<button class="chip ${String(t.id) === String(sel.translator) ? 'on' : ''}" data-tr="${esc(t.id)}">${isUAname(t.name) ? '<i class="ua-t">UA</i>' : ''}${esc(t.name)}</button>`).join('')}</div></section>` : ''}
  ${T.series ? `<section><p class="lbl">Сезон</p><div class="chips">${seasons.map(s =>
     `<button class="chip ${s.n === sel.season ? 'on' : ''}" data-s="${s.n}">${s.n}</button>`).join('')}</div></section>
  <section><p class="lbl">Серія</p><div class="eps">${(cur ? cur.episodes : []).map(e =>
     { const m = memOf(sel.season, e), seen = isSeen(sel.season, e), part = !seen && m && m.f > 0.02;
       return `<button class="ep ${e === sel.episode ? 'cur' : ''} ${seen ? 'seen' : ''} ${part ? 'part' : ''}" data-e="${e}"
         ${m ? `title="${clock(m.pos)} з ${clock(m.dur)}"` : ''}>${e}${part ? `<i style="width:${Math.round(m.f * 100)}%"></i>` : ''}</button>`; }).join('')}</div>

    if (st.checked !== last) { last = st.checked; delete DCACHE[tab + '|' + param];
      const d = await api('kino/discover', {tab, param}).catch(() => null);
      if (d && !d.error && $('dbox')) { DCACHE[tab + '|' + param] = d; drawGrid($('dbox'), d.items || []); } }
    if (!st.queue && !st.working) clearInterval(POLL);
  }, 4000);
}

// ---------- Taste questionnaire (7 steps) ----------
let TQ = {step: 0, seed: null, t: null};
const ERAS = ['1950s', '1960s', '1970s', '1980s', '1990s', '2000s', '2010s', '2020s'];
const REG = [['hollywood', 'Англомовне'], ['europe', 'Європа'], ['asia', 'Азія'], ['ukraine', 'Україна'], ['nordic', 'Скандинавія'], ['latam', 'Латинська Америка']];
const MOODS = [['light', 'Легке'], ['serious', 'Серйозне'], ['dark', 'Темне, напружене'], ['mind', 'Розриває мозок']];
const LANGS = [['ua', 'Українська озвучка'], ['en', 'Оригінал EN'], ['ru', 'Російська озвучка']];
async function openTaste(){
  buzz(); $('tq').classList.add('show'); $('tqB').innerHTML = '<div class="spin"></div>';
  const [seed, cur] = await Promise.all([TQ.seed || api('kino/seed', {}).catch(() => null), api('kino/taste', {}).catch(() => ({}))]);
  TQ.seed = seed || {films: [], directors: [], genres: []};
  const t = (cur && cur.taste) || {};
  TQ.t = {genres: t.genres || {}, eras: t.eras || [], regions: t.regions || [], directors: t.directors || [], films: t.films || {}, langs: t.langs || ['ua'], mood: t.mood || [], maxlen: t.maxlen || 0};
  TQ.step = 0; drawTaste();
}
function drawTaste(){
  const t = TQ.t, sd = TQ.seed, N = 7;
  $('tqS').innerHTML = Array.from({length: N}, (_, i) => `<i class="${i <= TQ.step ? 'on' : ''}"></i>`).join('');
  const multi = (list, arr) => `<div class="chips">${list.map(([k, n]) => `<button class="chip ${arr.includes(k) ? 'on' : ''}" data-m="${esc(k)}">${esc(n)}</button>`).join('')}</div>`;
  const steps = [
    ['Жанри', 'Натискання: 👍 люблю → 👎 не моє → нейтрально.', `<div class="chips">${(sd.genres || []).map(([g, n]) => `<button class="chip ${t.genres[g] > 0 ? 'like' : t.genres[g] < 0 ? 'dis' : ''}" data-g="${g}">${esc(n)}</button>`).join('')}</div>`],
    ['Епохи', 'Кіно яких десятиліть вам ближче.', multi(ERAS.map(e => [e, e.replace('s', '-ті')]), t.eras)],
    ['Звідки кіно', 'Можна кілька.', multi(REG, t.regions)],
    ['Режисери', 'Чиї фільми ви любите.', multi((sd.directors || []).map(d => [d, d]), t.directors)],
    ['Відомі фільми', 'Оцініть ті, що бачили. Не бачили - пропускайте.', `<div class="tqf">${(sd.films || []).map(f => `<div>${f.poster ? `<img src="${esc(f.poster)}" alt="">` : ''}<span>${esc(f.title)}</span>
      <div class="b"><button data-f="${f.imdb}" data-v="1" class="${t.films[f.imdb] > 0 ? 'on' : ''}">👍</button><button data-f="${f.imdb}" data-v="-1" class="${t.films[f.imdb] < 0 ? 'on' : ''}">👎</button></div></div>`).join('')}</div>`],
    ['Мова', 'Яку озвучку шукати першою.', multi(LANGS, t.langs)],
    ['Настрій і тривалість', 'Що зазвичай хочеться ввечері.', multi(MOODS, t.mood) + `<p style="margin-top:14px">Тривалість</p>` + `<div class="chips">${[[0, 'Будь-яка'], [120, 'До 2 год'], [150, 'До 2,5 год']].map(([v, n]) => `<button class="chip ${t.maxlen === v ? 'on' : ''}" data-l="${v}">${n}</button>`).join('')}</div>`]];
  const [h, sub, body] = steps[TQ.step];
  $('tqB').innerHTML = `<h3>${h}</h3><p>${sub}</p>${body}`;
  $('tqPrev').style.visibility = TQ.step ? 'visible' : 'hidden'; $('tqNext').textContent = TQ.step === N - 1 ? 'Зберегти' : 'Далі';
  const key = ['', 'eras', 'regions', 'directors', '', 'langs', 'mood'][TQ.step];
  $('tqB').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { buzz(); const g = b.dataset.g, v = t.genres[g] || 0; t.genres[g] = v === 0 ? 1 : v > 0 ? -1 : 0; if (!t.genres[g]) delete t.genres[g]; drawTaste(); });
  $('tqB').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { buzz(); const a = t[key], k = b.dataset.m; const i = a.indexOf(k); i < 0 ? a.push(k) : a.splice(i, 1); b.classList.toggle('on'); });
  $('tqB').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { buzz(); const f = b.dataset.f, v = +b.dataset.v; t.films[f] = t.films[f] === v ? 0 : v; if (!t.films[f]) delete t.films[f]; drawTaste(); });
  $('tqB').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { buzz(); t.maxlen = +b.dataset.l; drawTaste(); });
}
$('tqPrev').onclick = () => { buzz(); TQ.step = Math.max(0, TQ.step - 1); drawTaste(); };
$('tqNext').onclick = async () => { buzz();
  if (TQ.step < 6) { TQ.step++; drawTaste(); $('tq').scrollTop = 0; return; }
  await api('kino/taste', {taste: TQ.t}).catch(() => {}); $('tq').classList.remove('show'); DCACHE = {}; toast('Смак збережено. Підбираю фільми…');
  if (location.hash === '#/d/foryou' || location.hash === '#/d') route(); else go('/d/foryou'); };
$('tqX').onclick = () => { buzz(); $('tq').classList.remove('show'); };

api('kino/home').then(h => { HOMELISTS = {fav: (h && h.fav) || [], watch: (h && h.watch) || []}; }).catch(() => {});

route();
</script>

// A new core build reloads this page by itself (home-screen app and the Mac panel keep it open for hours).
(() => { let mine = null;
  const check = async () => { try { const v = (await (await fetch('/api/version', {cache: 'no-store'})).json()).v;
    if (mine === null) mine = v; else if (v !== mine && !document.querySelector('#phone.show, #tor.show')) location.reload(); } catch (e) {} };
  check(); setInterval(check, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); }); })();
</script>
