<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Пошук">
<meta name="theme-color" content="#0e0f12"><meta name="color-scheme" content="dark"><title>Пошук торентів</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0e0f12;--card:#17191e;--line:#2a2d35;--tx:#eceef2;--mut:#8b909c;--g:#3ecf6e;--y:#f2c14e;--r:#ff5d5d;--b:#5aa9ff;--u:#9b8cff;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:760px;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 14px 40px}
[hidden]{display:none!important}
h2{font-size:13px;font-weight:600;color:var(--mut);margin:20px 0 8px}
button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;min-height:44px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
button.go{background:var(--b);border-color:var(--b);color:#fff;font-weight:600;min-width:64px}
button.pri{background:#24364d;border-color:var(--b);color:#cfe4ff;font-weight:600}
button.have{background:#11351f;border-color:#1f6b3a;color:#7ff0a4;font-weight:600}
button.red{background:#3a1212;border-color:#7a2323;color:#ffb3b3}
button.red.solid{background:var(--r);border-color:var(--r);color:#fff;font-weight:700}
button.dang{color:#ff9a9a}
/* top bar: tabs + server chip */
.top{display:flex;gap:8px;align-items:stretch;margin:0 0 12px}
.seg{flex:1;min-width:0;display:flex;gap:3px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:13px}
.seg button{flex:1 1 0;border:0;background:transparent;color:var(--mut);font-weight:600;border-radius:10px;padding:8px 4px;white-space:nowrap}
.seg button.on{background:#24364d;color:#cfe4ff}
.n{display:inline-block;min-width:17px;height:17px;padding:0 4px;margin-left:4px;border-radius:9px;background:var(--b);color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center;vertical-align:1px}
.srv{display:flex;align-items:center;gap:6px;padding:0 11px;border-radius:13px;max-width:38%;font-weight:600}
.srv .d{margin:0;flex:none}.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.car{color:var(--mut);font-size:11px}
@media (max-width:359px){.seg button{flex:1 1 auto;font-size:13px;padding:8px 3px}.n{min-width:16px;height:16px;line-height:16px;margin-left:3px;padding:0 3px;font-size:10px}.car{display:none}.srv{padding:0 9px}}
/* search */
form{display:flex;gap:8px}input[type=search]{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 14px;font-size:17px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}.pill{padding:5px 12px;border-radius:22px;font-size:13px}.pill.on,.cats button.on{background:#24364d;border-color:var(--b);color:#cfe4ff}
.cats{display:flex;gap:6px;overflow-x:auto;margin:8px -14px 0;padding:0 14px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:5px 13px;border-radius:22px}.cats button.z{opacity:.45}.cats small{color:var(--mut);margin-left:5px;font-size:12px}.cats button.on small{color:#9cc4ef}
.src{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 0;font-size:11px;color:var(--mut)}.src span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 6px}.src .d{width:6px;height:6px;margin-right:4px}
.d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--mut)}.d.ok{background:var(--g)}.d.err{background:var(--r)}.d.run,.d.wait{background:var(--y);animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
.card,.row,.tor{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:8px 0}.row.bad{opacity:.62}
.card{margin:10px 0}.card .t{font-size:17px}.card .row{background:#121418;border-radius:12px}.rows{margin-top:10px;border-top:1px solid var(--line);padding-top:2px}
.sub.rn{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.t{font-weight:600;font-size:15px;word-break:break-word}.sub{color:var(--mut);font-size:12px;margin-top:2px;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0 0}.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#22252c;color:#c9cdd6}
.tag.ok{background:#11351f;color:#7ff0a4}.tag.dv5{background:#3a0b0b;color:#ff8a8a}.tag.enc{background:#3a300b;color:#ffd77a}.tag.ua{background:#14305a;color:#ffd84d}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.acts button{min-height:44px;flex:1 1 auto}
.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.u{color:var(--u)}.b{color:var(--b)}
.job{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;min-height:44px}.job small{color:var(--mut)}
.msg{color:var(--mut);font-size:13px;margin:10px 0}.msg.r{color:var(--r)}
/* downloads */
.tor{transition:border-color .3s,box-shadow .3s}.tor.hl{border-color:var(--b);box-shadow:0 0 0 2px #24364d}
.tor .h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.tor .nm{font-weight:600;word-break:break-word;min-width:0}
.eng{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#22252c;color:#c9cdd6;margin-top:2px}.eng.tv{background:#14305a;color:#cfe4ff}
.bar{height:6px;background:#22252c;border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .5s}.bar.p i{background:var(--mut)}.bar.s i{background:var(--b)}.bar.e i{background:var(--r)}
.stat{color:var(--mut);font-size:12px;margin-top:6px}.stat .st{font-weight:700}.tor .err{color:var(--r);font-size:12px;margin-top:4px;word-break:break-word}
.empty{text-align:center;color:var(--mut);padding:36px 12px}.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.foot{margin-top:18px}.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border-radius:14px;padding:8px 14px}
.sw small{display:block;color:var(--mut);font-size:12px;font-weight:400}.sw span{font-weight:600}
.knob{flex:none;position:relative;width:46px;height:28px;border-radius:14px;background:#3a3e48;transition:background .2s}
.knob::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true] .knob{background:var(--g)}.sw[aria-checked=true] .knob::after{transform:translateX(18px)}
/* bottom sheet */
.shade{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:560px;max-height:84vh;max-height:84dvh;background:#1b1e24;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:8px 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
.grab{flex:none;width:40px;height:4px;border-radius:2px;background:#3a3e48;margin:2px auto 10px}
.sh-t{flex:none;font-size:17px;font-weight:700;margin:0 0 2px;word-break:break-word}.sh-s{flex:none;color:var(--mut);font-size:13px;margin-bottom:8px;word-break:break-word}
.list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.fr{display:flex;gap:12px;align-items:center;min-height:48px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.fr input{flex:none;width:24px;height:24px;accent-color:var(--b)}.fr .fn{flex:1;min-width:0;word-break:break-word;font-size:14px}
.fr small{display:block;color:var(--mut);font-size:11px;word-break:break-all}.fr .fz{flex:none;color:var(--mut);font-size:12px;text-align:right}
.qa{flex:none;color:var(--mut);font-size:13px;margin:0 0 6px}
.bt{flex:none;display:flex;gap:8px;margin-top:10px}.bt button{flex:1}.bt.col{flex-direction:column}.bt.col button small{display:block;color:var(--mut);font-size:12px;font-weight:400}.bt.col .red small{color:#e79a9a}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none}
.srow small{display:block;color:var(--mut);font-size:12px;word-break:break-all}.srow .go2{color:var(--mut);font-size:20px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 28px);text-align:center;background:#2b2f38;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:30}
</style></head><body>
<div class="top">
 <div class="seg" role="tablist" aria-label="Розділи">
  <button type="button" role="tab" data-tab="search" class="on" aria-selected="true">Пошук</button>
  <button type="button" role="tab" data-tab="dl" aria-selected="false">Завантаження<b class="n" id="dlN" hidden></b></button>
 </div>
 <button type="button" class="srv" id="srv" aria-label="Сервер"><i class="d" id="srvDot"></i><span class="sn" id="srvName">…</span><span class="car">▾</span></button>
</div>

<main id="vSearch">
<form id="f"><input id="q" type="search" placeholder="фільм, музика, книга, гра, софт, tt0944947…" autocomplete="off" enterkeyhint="search"><button class="go">Шукати</button></form>
<div class="pills">
 <button type="button" class="pill" data-k="film" title="лише релізи, де назва збігається точно">Точна назва</button>
 <span style="width:8px"></span>
 <button type="button" class="pill" data-f="tv">TV ✓</button><button type="button" class="pill" data-f="ua">UA</button>
 <button type="button" class="pill" data-f="2160">4K</button><button type="button" class="pill" data-f="1080">1080</button>
</div>
<div class="cats" id="cats" hidden></div>
<div class="src" id="src"></div>
<div id="res"></div>
<h2>Останні пошуки (агенти, телефон, Мак)</h2><div id="jobs"></div>
</main>

<main id="vDl" hidden>
<div class="msg" id="dinfo">Завантажую…</div>
<div id="dlist"></div>
<div class="empty" id="dempty" hidden><b>Нічого не качається</b>Знайдіть щось у вкладці «Пошук» і натисніть «Скачати».</div>
<div class="foot">
 <button type="button" class="sw" id="quiet" role="switch" aria-checked="false" disabled><span>Тихий режим<small>обмежує швидкість завантаження</small></span><i class="knob"></i></button>
 <div class="msg" id="free"></div>
</div>
</main>

<div class="shade" id="shade" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
// Every call returns JSON; a network failure or timeout becomes {error, net:true}, so callers never need try/catch.
async function api(p, b, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 30000);
  try {
    const r = await fetch('api/' + p, b ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b), signal: c.signal} : {signal: c.signal});
    return await r.json();
  } catch (e) { return {error: e.name === 'AbortError' ? 'Сервер не відповів вчасно' : 'Немає звʼязку з сервером', net: true}; }
  finally { clearTimeout(t); }
}
const KIND = {film: 'Фільм', series: 'Серіал', music: 'Музика', book: 'Книга', game: 'Гра', software: 'Софт', other: 'Інше'};
const CATS = [['all', 'Усе'], ['film', 'Кіно'], ['series', 'Серіали'], ['music', 'Музика'], ['book', 'Книги'], ['game', 'Ігри'], ['software', 'Софт']];
const STW = {downloading: 'Качається', paused: 'Пауза', queued: 'У черзі', checking: 'Перевірка', seeding: 'Роздає', done: 'Готово', error: 'Помилка'};
const opt = {film: false}, flt = {}, open = new Set(), added = {}, pending = {}, busy = new Set(), scrollAt = {search: 0, dl: 0};
let job = null, jobGen = 0, timer = 0, shownId = '', tab = 'search', srv = null, cat = 'all', views = [], reg = [], sig = '';
let torrents = null, tErr = '', mine = {}, client = null, clientAt = 0, tTimer = 0, tGen = 0, tSeq = 0, tApplied = 0;
let sheetActs = {}, sheetChange = null;

// ---------- small helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const toast = (t, ms) => { const e = $('toast'); clearTimeout(e.t); if (!t) { e.style.display = 'none'; return; } e.textContent = t; e.style.display = 'block'; e.t = setTimeout(() => e.style.display = 'none', ms || 2600); };
const ago = t => { const s = Date.now() / 1000 - t; return s < 60 ? 'щойно' : s < 3600 ? Math.round(s / 60) + ' хв тому' : s < 86400 ? Math.round(s / 3600) + ' год тому' : Math.round(s / 86400) + ' дн тому'; };
const num = v => String(v).replace('.', ',');
const gb = v => v ? (v >= 1 ? num(v.toFixed(1)) + ' ГБ' : Math.round(v * 1024) + ' МБ') : '';
const size = v => v >= 1073741824 ? num((v / 1073741824).toFixed(1)) + ' ГБ' : v >= 1048576 ? Math.round(v / 1048576) + ' МБ' : Math.round((v || 0) / 1024) + ' КБ';
const mbs = v => v >= 1048576 ? num((v / 1048576).toFixed(1)) + ' МБ/с' : Math.round((v || 0) / 1024) + ' КБ/с';
const eta = s => s < 0 ? '' : s < 60 ? 'ще <1 хв' : s < 3600 ? 'ще ' + Math.floor(s / 60) + ' хв' : s < 86400 ? 'ще ' + Math.floor(s / 3600) + ' год ' + Math.floor(s % 3600 / 60) + ' хв' : 'ще ' + Math.floor(s / 86400) + ' дн ' + Math.floor(s % 86400 / 3600) + ' год';
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const rel = n => n + ' ' + plural(n, 'реліз', 'релізи', 'релізів');
const host = u => String(u || '').replace(/^https?:\/\//, '').replace(/[\/?#].*$/, '');
// Readable name: the part after the first " / " in Russian-style titles, without the bracket tail.
const nice = t => { const p = t.split(' / '); let n = p.length > 1 ? p.slice(1).join(' / ') : t; n = n.replace(/\s*[\[(|].*$/, '').trim(); return n.length > 3 ? n : t; };
const readable = n => { let s = nice(String(n || '')); if (!/\s/.test(s)) s = s.replace(/[._]+/g, ' ').trim(); return s || 'Без назви'; };
const TV = () => !!(srv && srv.tv);

// ---------- bottom sheet ----------
const shade = $('shade'), panel = $('panel');
function sheet(html, acts, change) { panel.innerHTML = '<div class="grab"></div>' + html; sheetActs = acts || {}; sheetChange = change || null; shade.hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet() { shade.hidden = true; document.body.style.overflow = ''; panel.innerHTML = ''; sheetActs = {}; sheetChange = null; }
shade.addEventListener('click', e => { if (e.target === shade) return closeSheet(); const b = e.target.closest('[data-x]'); if (b && sheetActs[b.dataset.x]) sheetActs[b.dataset.x](b); });
shade.addEventListener('change', e => { if (sheetChange) sheetChange(e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !shade.hidden) closeSheet(); });

// ---------- server chip ----------
async function loadServer() {
  const s = await api('server'); srv = s.error ? null : s;
  $('srvName').textContent = srv ? srv.name : 'Сервер'; $('srvDot').className = 'd ' + (srv ? 'ok' : 'err');
  draw();
}
function openServers() {
  const peers = (srv && srv.peers || []).filter(p => p && p.url);
  sheet(`<h3 class="sh-t">Сервери</h3><div class="sh-s">Натисніть на інший сервер, щоб відкрити його сторінку.</div><div class="list">
    <div class="srow"><span><b>${esc(srv ? srv.name : 'Сервер')}</b> · цей сервер<small>${srv ? (srv.tv ? 'є ТВ' : 'без ТВ') + (srv.public_url ? ' · ' + esc(host(srv.public_url)) : '') : 'не відповідає'}</small></span><i class="d ${srv ? 'ok' : 'err'}"></i></div>
    ${peers.map(p => /^https?:\/\//.test(p.url) ? `<a class="srow" href="${esc(p.url.replace(/\/+$/, ''))}/"><span><b>${esc(p.name || host(p.url))}</b><small>${esc(host(p.url))}</small></span><span class="go2">›</span></a>`
      : `<div class="srow"><span><b>${esc(p.name || '')}</b><small>адреса ще не задана</small></span></div>`).join('')}
    ${peers.length ? '' : '<div class="msg">Інших серверів не задано</div>'}</div>
    <div class="bt"><button type="button" data-x="close">Закрити</button></div>`, {close: closeSheet});
}

// ---------- search tab: filters, work cards, rows ----------
const pass = t => (!flt.tv || t.tv_ok) && (!flt.ua || t.ua || (t.audio || []).includes('UA')) &&
  (!(flt['2160'] || flt['1080']) || (flt['2160'] && t.quality == 2160) || (flt['1080'] && t.quality == 1080));
const filtered = () => !!(flt.tv || flt.ua || flt['2160'] || flt['1080']);
const GR = {g: 0, y: 1, u: 1, r: 2};
// the same order as picker.py: grade, TV-ready, UA, quality, seeds (used only when a filter removes the server's best)
const score = (r, k) => { const g = GR[r.grade] ?? 2, s = r.seeds || 0;
  return k === 'film' || k === 'series' ? [g, r.tv_ok ? 0 : r.dv5 ? 3 : 1, r.ua || (r.audio || []).includes('UA') ? 0 : 1, -(r.quality || 0), -s] : [g, -s]; };
const cmp = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; return 0; };
function view(w) {
  const rows = filtered() ? w.rows.filter(pass) : w.rows;
  const best = w.best && pass(w.best) ? w.best : rows.length ? rows.reduce((a, b) => cmp(score(b, w.kind), score(a, w.kind)) < 0 ? b : a) : null;
  return best ? {w, rows, best} : null;
}
function tagsOf(t) { const g = [];
  if (t.quality) g.push(`<span class="tag">${t.quality == 2160 ? '4K' : t.quality + 'p'}</span>`);
  if (t.dv5) g.push('<span class="tag dv5" title="Dolby Vision без HDR10: на ТВ кольори зламаються">DV5 ✕</span>');
  else if (t.tv_ok) g.push(`<span class="tag ok" title="ТВ грає без перекодування">TV ✓${t.tenbit ? ' 10-біт' : ''}</span>`);
  else if (t.mbps > 36) g.push(`<span class="tag enc" title="перекодую під Wi-Fi ТВ">~${t.mbps} Мбіт/с</span>`);
  if (t.codec) g.push(`<span class="tag">${t.codec.toUpperCase()}</span>`); if (t.hdr && !t.dv5) g.push('<span class="tag">HDR</span>');
  (t.audio || []).forEach(a => g.push(`<span class="tag ${a == 'UA' ? 'ua' : ''}">${esc(a)}</span>`));
  if (t.category) g.push(`<span class="tag">${esc(t.category.slice(0, 28))}</span>`);
  if (t.size_gb) g.push(`<span class="tag">${gb(t.size_gb)}</span>`);
  if (t.tracker !== 'audiobookbay') g.push(`<span class="tag"><b class="${t.grade}">●</b> ${t.seeds} сід</span>`);
  return g.join(''); }
// "is it already here": the live torrent list wins; before it loads, the mark the server put on the row
const rid = t => t.hash || (t.topic ? 't' + t.topic : '') || t.page || t.magnet || t.title || '';
const hashOf = t => (added[rid(t)] || t.hash || '').toLowerCase();   // the hash Transmission reported for this row wins
const haveOf = t => { const h = hashOf(t); return (h && mine[h]) || (torrents === null && t.have) || null; };
const pct = h => Math.floor((h.progress || 0) * 100);
const dlBtn = (t, i) => { const h = haveOf(t);
  return h ? `<button type="button" class="have" data-a="goto" data-i="${i}">є тут ${pct(h)} %</button>` : `<button type="button" class="pri" data-a="dl" data-i="${i}">Скачати</button>`; };
function row(t) { const i = reg.push(t) - 1, tv = TV();
  return `<div class="row ${t.dv5 ? 'bad' : ''}"><div class="t">${esc(nice(t.title))}</div><div class="sub">${esc(t.tracker)}${t.also ? ' + ' + esc(t.also.join(', ')) : ''} · ${esc(t.title)}</div>
  <div class="tags">${tagsOf(t)}</div><div class="acts">${tv ? `<button type="button" data-a="tv" data-i="${i}">На ТВ</button>` : ''}${dlBtn(t, i)}

    {back: ask, close: closeSheet, rm: async b => { b.disabled = true; closeSheet(); if (await ctl(t.id, {action: 'remove_data'})) gone(t, 'Видалено разом з файлами'); }});
  ask();
}
$('dlist').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.closest('.tor').dataset.id, t = (torrents || []).find(x => x.id === id), a = b.dataset.a; if (!t) return;
  if (a === 'rm') return openDelete(t);
  b.disabled = true;
  try {
    if (a === 'files') {
      const fl = await api('torrents/' + encodeURIComponent(id) + '/files');
      if (!Array.isArray(fl)) toast(fl.error || 'Не вийшло', 5000); else if (!fl.length) toast('Список файлів ще не прийшов - спробуйте за хвилину');
      else openFiles({id, title: t.name, files: fl, add: false});
    } else if (a === 'pause' || a === 'resume') { if (await ctl(id, {action: a})) await loadTorrents(); }
    else if (a === 'keep') { toast('Переношу в Transmission…'); if (await ctl(id, {action: 'keep'})) { toast('Залишив собі'); await loadTorrents(); } }
  } finally { b.disabled = false; }
});
// footer: quiet mode and free space
async function loadClient() { clientAt = Date.now(); const c = await api('client', null, 8000); if (!c.error) client = c; drawFoot(c.error); }
function drawFoot(err) {
  const sw = $('quiet'), f = $('free'); sw.disabled = !client;
  if (client) sw.setAttribute('aria-checked', !!client.alt_speed);
  const low = client && client.free_gb != null && client.free_gb < 10;
  f.className = 'msg' + (low || (err && !client) ? ' r' : '');
  f.textContent = err && !client ? err : client && client.free_gb != null ? 'вільно ' + num(client.free_gb.toFixed(1)) + ' ГБ' + (low ? ' - нові завантаження стануть на паузу' : '') : '';
}
$('quiet').onclick = async () => {
  const sw = $('quiet'), on = sw.getAttribute('aria-checked') !== 'true'; sw.setAttribute('aria-checked', on); sw.disabled = true;
  const r = await api('client', {alt_speed: on}); sw.disabled = false;
  if (r.error) { sw.setAttribute('aria-checked', !on); return toast('Не вийшло: ' + r.error, 5000); }
  client = r; clientAt = Date.now(); drawFoot(); toast(on ? 'Тихий режим увімкнено' : 'Тихий режим вимкнено');
};
$('srv').onclick = openServers;

loadServer(); jobs(); tick();
if (location.hash === '#dl') setTab('dl'); else if (location.hash.length > 1) poll(location.hash.slice(1));
</script></body></html>
